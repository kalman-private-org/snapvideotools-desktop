# 语音模型失败原因
settings.speech.error.network=Der Download wurde durch ein Netzwerkproblem unterbrochen. Überprüfen Sie Ihre Verbindung und versuchen Sie es erneut. Der heruntergeladene Fortschritt wurde beibehalten.
