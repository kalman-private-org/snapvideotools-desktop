settings.speech.error.modelLoad=Die Modelldateien wurden heruntergeladen, aber die Sprach-Engine konnte sie nicht laden. Starten Sie die App neu und versuchen Sie es erneut. Wenn es immer noch fehlschlägt, installieren Sie die neueste Version neu.
