settings.speech.error.modelLoad=Pliki modelu zostały pobrane, ale aparat mowy nie mógł ich załadować. Uruchom ponownie aplikację i spróbuj ponownie; jeśli nadal się nie powiedzie, zainstaluj ponownie najnowszą wersję.
settings.speech.error.interrupted=Konfiguracja modelu została przerwana. Spróbuj ponownie, aby kontynuować z zapisanego postępu pobierania.
