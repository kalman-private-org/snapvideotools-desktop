# 语音模型失败原因
settings.speech.error.network=ネットワークの問題によりダウンロードが中断されました。接続を確認して再試行してください。ダウンロードの進行状況は保持されています。
settings.speech.error.timeout=モデル サーバーが時間内に応答しませんでした。ネットワークまたはプロキシを確認して、再試行してください。
settings.speech.error.server=モデル サーバーは一時的に利用できません (%s)。後で再試行してください。
settings.speech.error.diskSpace=音声モデルをインストールするのに十分な空きディスク容量がありません。スペースを解放して再試行してください。
settings.speech.error.permission=SnapVideoTools はローカル モデル フォルダーに書き込むことができません。フォルダーのアクセス許可を確認して、再試行してください。
settings.speech.error.checksum=ダウンロードしたモデル ファイルが不完全か破損していました。それは削除されました。クリーン コピーのダウンロードを再試行してください。
settings.speech.error.archive=モデル アーカイブを抽出できませんでした。破損したアーカイブは削除されました。再試行してください。
settings.speech.error.modelLoad=モデル ファイルはダウンロードされましたが、音声エンジンはモデル ファイルをロードできませんでした。アプリを再起動して再試行してください。それでも失敗する場合は、最新バージョンを再インストールしてください。
settings.speech.error.interrupted=モデルのセットアップが中断されました。保存されたダウンロードの進行状況から続行を再試行します。
settings.speech.error.unknown=モデルのセットアップに失敗しました。詳細: %s
settings.speech.error.unknownDetail=不明なシステムエラー
