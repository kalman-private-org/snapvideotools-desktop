settings.speech.error.modelLoad=تم تنزيل ملفات النموذج، لكن لم يتمكن محرك الكلام من تحميلها. أعد تشغيل التطبيق ثم أعد المحاولة؛ إذا استمر الفشل، فأعد تثبيت الإصدار الأحدث.
