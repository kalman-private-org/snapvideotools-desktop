# 语音模型失败原因
settings.speech.error.network=Descărcarea a fost întreruptă de o problemă de rețea. Verificați-vă conexiunea și încercați din nou; progresul descărcat a fost păstrat.
settings.speech.error.timeout=Serverul model nu a răspuns la timp. Verificați rețeaua sau proxy-ul și reîncercați.
settings.speech.error.server=Serverul model este temporar indisponibil (%s). Vă rugăm să reîncercați mai târziu.
settings.speech.error.diskSpace=Nu există suficient spațiu liber pe disc pentru a instala modelul de vorbire. Eliberați spațiu și reîncercați.
settings.speech.error.permission=SnapVideoTools nu poate scrie în folderul model local. Verificați permisiunile folderului și încercați din nou.
settings.speech.error.checksum=Fișierul model descărcat a fost incomplet sau deteriorat. A fost eliminat; reîncercați să descărcați o copie curată.
settings.speech.error.archive=Arhiva modelului nu a putut fi extrasă. Arhiva deteriorată a fost eliminată; te rog din nou.
settings.speech.error.modelLoad=Fișierele model au fost descărcate, dar motorul de vorbire nu le-a putut încărca. Reporniți aplicația și reîncercați; dacă tot eșuează, reinstalați cea mai recentă versiune.
settings.speech.error.interrupted=Configurarea modelului a fost întreruptă. Reîncercați să continuați de la progresul de descărcare salvat.
settings.speech.error.unknown=Configurarea modelului a eșuat. Detalii: %s
settings.speech.error.unknownDetail=Eroare de sistem necunoscută
