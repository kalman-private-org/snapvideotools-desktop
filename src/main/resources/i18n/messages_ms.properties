# 语音模型失败原因
settings.speech.error.network=Muat turun telah terganggu oleh masalah rangkaian. Semak sambungan anda dan cuba semula; kemajuan yang dimuat turun telah disimpan.
settings.speech.error.timeout=Pelayan model tidak bertindak balas dalam masa. Semak rangkaian atau proksi anda dan cuba semula.
