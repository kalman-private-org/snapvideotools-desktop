settings.speech.error.archive=Arkib model tidak dapat diekstrak. Arkib yang rosak telah dialih keluar; sila cuba semula.
settings.speech.error.modelLoad=Fail model telah dimuat turun, tetapi enjin pertuturan tidak dapat memuatkannya. Mulakan semula apl dan cuba semula; jika masih gagal, pasang semula versi terkini.
